[theme]
theme = "plain"
[theme.overrides]
idle_bg = "#111111cc"
idle_fg = "#ffffffff"
good_fg = "#00ff00ff"
warning_fg = "#ffa600ff"
critical_fg = "#ff0000ff"
separator = ""

[icons]
icons = "awesome6"

[[block]]
block = "net"
format = " $icon {$ssid|} "
inactive_format = ""
[[block.click]]
button = "left"
cmd = "foot -e nmtui"

[[block]]
block = "sound"
driver = "auto"
max_vol = 150
format = " $icon {$volume|} "
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "backlight"
format = " $icon $brightness "
[[block.click]]
button = "left"
cmd = "brightnessctl set 100%"
[[block.click]]
button = "up"
cmd = "brightnessctl set +5%"
[[block.click]]
button = "down"
cmd = "brightnessctl set 5%-"

[[block]]
block = "battery"
device = "BAT1"
interval = 30
format = " $icon $percentage {$time|} "
full_format = " $icon $percentage full "
not_charging_format = "  $icon $percentage "

[[block]]
block = "time"
interval = 10
format = "  $timestamp.datetime(f:'%Y-%m-%d')  $timestamp.datetime(f:'%H:%M %Z') "

[[block]]
block = "custom"
command = "echo '  '"
interval = "once"
[[block.click]]
button = "left"
cmd = "systemctl poweroff"
