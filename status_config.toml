[theme]
theme = "plain"
[theme.overrides]
separator = ""

[icons]
icons = "awesome6"

[icons.overrides]
volume_muted = "󰖁"

[[block]]
block = "net"
interval = 5
format = " $icon {$ssid|} "
[[block.click]]
button = "left"
cmd = "foot -e nmtui"

[[block]]
block = "sound"
driver = "pulseaudio"
max_vol = 150
show_volume_when_muted = true
format = " $icon {$volume|} "
[[block.click]]
button = "left"
cmd = "sh -c 'myxer'"

[[block]]
block = "backlight"
format = " $icon $brightness "
[[block.click]]
button = "left"
cmd = "brightnessctl set 100%"
[[block.click]]
button = "up"
cmd = "brightnessctl set +5%"
[[block.click]]
button = "down"
cmd = "brightnessctl set 5%-"

[[block]]
block = "battery"
device = "BAT1"
interval = 10
format = " $icon $percentage {$time|} "
full_format = " $icon $percentage full "
not_charging_format = "  $icon $percentage "


[[block]]
block = "time"
interval = 10
format = "  $timestamp.datetime(f:'%Y-%m-%d')  $timestamp.datetime(f:'%H:%M %Z') "

[[block]]
block = "custom"
command = "echo ' 󰷜 '"
interval = "once"
[[block.click]]
button = "left"
cmd = "sh -c 'wdisplays'"

[[block]]
block = "custom"
command = "echo '  '"
interval = "once"
[[block.click]]
button = "left"
cmd = "systemctl poweroff"
